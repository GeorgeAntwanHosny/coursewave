[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 120s

; Let compose's environment reach PHP, and show worker stderr in `docker compose logs`.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
