[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Sends notifications, broadcasts them to Reverb, generates certificate PDFs, fans out live-session audiences.
; --max-time recycles each worker hourly so memory never creeps; supervisor starts a fresh one.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKERS)s
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=0
stopsignal=TERM
; a worker finishes its current job on SIGTERM; give it time
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
