name: coursewave

# Infrastructure wiring. Everything else (secrets, Stripe, business rules) comes from the root .env via env_file.
# `environment` wins over `env_file`, so a stray APP_ENV=local in .env can never reach production.
x-api-env: &api-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-coursewave}
  DB_USERNAME: ${DB_USERNAME:-coursewave}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_CLIENT: phpredis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  BROADCAST_CONNECTION: reverb
  # Inside the network the API talks to Reverb by service name. Browsers use the PUBLIC_* values instead.
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"

# Every API role uses the same image, built once by `web-image`.
# pull_policy: never stops compose from looking for it on Docker Hub (it only exists locally).
x-api-service: &api-service
  image: coursewave-api:${IMAGE_TAG:-latest}
  pull_policy: never
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-coursewave}
      POSTGRES_USER: ${DB_USERNAME:-coursewave}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Builds the shared API image once, then exits immediately. Every API role reuses that image.
  web-image:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: coursewave-api:${IMAGE_TAG:-latest}
    restart: "no"
    entrypoint: ["true"]

  # Runs once, to completion, before anything else starts (so replicas never race on migrations).
  migrate:
    <<: *api-service
    restart: "no"
    environment:
      <<: *api-env
      CONTAINER_ROLE: migrate
    depends_on:
      web-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *api-service
    environment:
      <<: *api-env
      CONTAINER_ROLE: web
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - storage_app:/var/www/html/storage/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/plans"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *api-service
    environment:
      <<: *api-env
      CONTAINER_ROLE: worker
      QUEUE_WORKERS: ${QUEUE_WORKERS:-2}
    volumes:
      - storage_app:/var/www/html/storage/app
    stop_grace_period: 130s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Exactly one scheduler. Two would run every scheduled task twice.
  scheduler:
    <<: *api-service
    environment:
      <<: *api-env
      CONTAINER_ROLE: scheduler
    volumes:
      - storage_app:/var/www/html/storage/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  reverb:
    <<: *api-service
    environment:
      <<: *api-env
      CONTAINER_ROLE: reverb
    ports:
      - "127.0.0.1:${WS_PORT:-8080}:8080"
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    depends_on:
      web-image:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
        NEXT_PUBLIC_REVERB_HOST: ${PUBLIC_REVERB_HOST:-localhost}
        NEXT_PUBLIC_REVERB_PORT: ${PUBLIC_REVERB_PORT:-8080}
        NEXT_PUBLIC_REVERB_SCHEME: ${PUBLIC_REVERB_SCHEME:-http}
    image: coursewave-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  # Certificate PDFs, uploads and the livewire-tmp disk. Shared by web, worker and scheduler.
  storage_app: